<!DOCTYPE html>
<head>
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
        }
        .email-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .button {
            color: #fff !important;
            background-color: #007BFF;
            border-color: #007BFF;
            border-radius: .25rem;
            text-decoration: none;
            padding: .375rem .75rem;
            font-size: 1rem;
            line-height: 1.5;
            display: inline-block;
            font-weight: bold;
        }
        .button a {
            color: #fff !important;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <p>Dear {{ name }},</p>
        <p>Recebemos uma solicitação para resetar a senha da sua conta. Clique no link abaixo para resetar sua senha.</p>
        <p>
            <a href="{{ reset_url }}" class="button">Resetar senha</a>
        </p>
        <i>Se você não fez essa solicitação, ignore esse email.</i>
        <br/>
        <p>Obrigado por nos escolher!</p>
        <p>Atenciosamente,<br>{{ app_name }}</p>
    </div>
</body>
</html>
