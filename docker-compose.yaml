services:
  api:
    container_name: career-path-api
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    # Toda a configuração vem de um único .env (veja .env.example).
    env_file:
      - .env
    environment:
      # Dentro da rede do compose, banco e Redis são alcançados pelo nome do serviço:
      # estes valores têm precedência sobre os do .env, que servem a quem roda fora do Docker.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: career-path-postgres
    # Só estas três variáveis chegam ao container do banco (nenhum outro segredo do .env).
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "always"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: career-path-redis
    # Só contadores de rate limit: nada precisa sobreviver a um restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Opcional: `docker compose --profile full up --build`. O frontend vive em outro repositório
  # (career-path-ai-web) e precisa estar clonado ao lado deste.
  web:
    profiles: ["full"]
    container_name: career-path-web
    build:
      context: ../career-path-ai-web
      dockerfile: docker/Dockerfile
      args:
        # O navegador (no host) fala com a API pela porta publicada acima.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
