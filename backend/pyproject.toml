[project]
name = "career-path-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "fastapi>=0.119.0",
    "fastapi-mail>=1.5.8",
    "google-genai>=2,<3",
    "httpx>=0.28",
    "limits[async-redis]>=5,<6",
    "openai>=2.3.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.1.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: precisa de um Postgres real (defina TEST_DATABASE_URL)"]
